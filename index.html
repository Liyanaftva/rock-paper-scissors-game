<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="game-header">
        <h1>Rock Paper Scissors</h1>
    </div>
    <div class="game-options">
        <button onclick="rock()" class="game-rock">Rock</button>
        <button onclick="paper()" class="game-paper">Paper</button>
        <button onclick="scissors()" class="game-scissors">Scissors</button>
    </div>
    <div class="game-result">
        <h4>You win</h4>
    </div>
    <div class="game-score">
        <h5>Player: 0</h5>
        <h5>Computer: 0</h5>
    </div>
</body>
</html>
