<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-header">
        <h1>Rock Paper Scissors</h1>
    </div>
    <div class="game-options_player">
        <button onclick="rock()" class="game-rock">Rock</button>
        <button onclick="paper()" class="game-paper">Paper</button>
        <button onclick="scissors()" class="game-scissors">Scissors</button>
    </div>
    <div class="game-overlay">
        <div class="game-player">
            <h1 class="game-player-hand">✊</h1>
        </div>
        <div class="game-countdown">3</div>
        <div class="game-computer">
            <h1 class="game-computer-hand">✊</h1>
        </div>
    </div>
    <div class="game-option-computer">
        <h4><span>Computer's Choice:</span><span class="game-choice-computer">Rock</span></h4>
    </div>
    <div class="game-result">
        <h4 class="game-result-text">You win</h4>
    </div>
    <div class="game-score">
        <p><span>Player:</span><span class="game-score-player">0</span>
        <span>Computer:</span><span class="game-score-computer">0</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
